name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'vehicle-names-database/dist/vehicle-names-database.json'
      - 'vehicle-names-database/scripts/build_pages_preview.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp -R website/. _site/
          cp vehicle-names-database/dist/vehicle-names-database.json _site/data/vehicle-names-database.json
          python3 vehicle-names-database/scripts/build_pages_preview.py vehicle-names-database/dist/vehicle-names-database.json _site/data/vehicle-names-preview.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
